<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=9" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=9" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=9" />
    <link rel="shortcut icon" href="/favicon.ico?v=9" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=9" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png?v=9" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png?v=9" />
    <meta name="theme-color" content="#0E1116" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ResumeIQ — Know exactly why your resume gets rejected by ATS software, and exactly how to fix it." />
    <title>ResumeIQ</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the stored/preferred theme before paint to avoid a flash of
      // the wrong theme on load.
      (function () {
        try {
          var stored = localStorage.getItem('resumeiq-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored ? stored === 'dark' : prefersDark;
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
